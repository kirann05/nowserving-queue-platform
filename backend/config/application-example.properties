# Copy this file to backend/config/application.properties and fill in your own
# values. That path is gitignored, so nothing you put there can be committed.
#
# Everything here is optional. The app starts and the core queue flow works
# with none of it — you just lose the feature each key enables, and the log
# says so on boot rather than failing silently.

# --- Traffic-aware travel times (Leave Now) --------------------------------
# Free key from https://developer.tomtom.com/. Without it the app falls back
# to a straight-line distance estimate and labels it as a rough estimate
# rather than pretending it accounts for traffic.
app.travel.tomtom.api-key=your_tomtom_api_key

# --- Web Push notifications ------------------------------------------------
# Generate a VAPID keypair — see docs/PUSH_NOTIFICATIONS_SETUP.md.
# With these absent, the ticket page tells the customer push is unavailable
# instead of offering a button that cannot deliver.
app.push.vapid.public-key=your_vapid_public_key
app.push.vapid.private-key=your_vapid_private_key
app.push.vapid.subject=mailto:you@example.com
