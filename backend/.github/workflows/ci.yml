# Sprint 6 — Continuous Integration (PRD §6.2).
#
# WHAT CI ACTUALLY IS: every push and every pull request gets built and tested
# automatically, by a machine that has never seen your laptop. It catches the
# two classics — "works on my machine" and "I forgot to run the tests" — and
# the green check becomes the signal a reviewer trusts before reading a diff.
#
# This file runs the moment the repo has a GitHub remote; nothing else to set
# up. Until then it stands as the documented, reviewable definition of what
# "passing" means.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a running build when new commits land on the same branch — no point
# spending minutes verifying code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.gradle between runs. Without it every build re-downloads
          # the entire dependency tree, turning a 2-minute job into 6.
          cache: gradle

      # NOTE: no "start Postgres" step. Testcontainers starts a real Postgres
      # and a real Redis itself, using the Docker daemon that GitHub's runners
      # already provide. That is precisely why the tests are written against
      # containers rather than an in-memory H2 — the same suite runs
      # identically on a laptop and on a runner, with no CI-only config.
      - name: Run tests
        run: ./gradlew test --no-daemon

      # Test results published even when the job fails — a red build should
      # tell you WHICH test broke without digging through raw logs.
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: build/reports/tests/test/

      - name: Build container image
        run: docker build -t nowserving-backend:${{ github.sha }} .

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    # The frontend lives in its own repository; this job is here as the
    # template for it. Remove the `if:` once the two are in one monorepo.
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # tsc is the real gate: TypeScript catches the contract drift between
      # frontend types and backend DTOs that would otherwise reach a user.
      - run: npx tsc -b
      - run: npm run build
