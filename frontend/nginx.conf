server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SINGLE-PAGE APP ROUTING — the one line people always forget.
    #
    # React Router owns paths like /t/abc123 and /b/xyz in the BROWSER. But if
    # a customer opens that URL directly (scanning a QR code always does), the
    # request reaches nginx first, which looks for a file called /t/abc123,
    # doesn't find one, and returns 404. Falling back to index.html lets the
    # app boot and route the URL itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must NOT be cached, or customers keep running an old
    # push handler long after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite fingerprints these filenames (app.a1b2c3.js), so they can be cached
    # forever — a new build produces a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cheap, useful hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;          # no clickjacking
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
