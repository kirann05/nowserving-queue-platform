# Local infrastructure only. Start the API and client using the README.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nowserving
      POSTGRES_USER: nowserving
      POSTGRES_PASSWORD: nowserving
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nowserving_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowserving -d nowserving"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nowserving_pgdata:
